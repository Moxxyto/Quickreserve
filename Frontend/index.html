<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>QuickReserve</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>QuickReserve 🔥</h1>
  <p>Gestiona tus citas fácilmente</p>

  <h2>Agendar Cita</h2>

  <input type="text" id="nombre" placeholder="Nombre del cliente">
  <input type="date" id="fecha">
  <input type="time" id="hora">

  <button onclick="reservar()">Reservar</button>
  <button onclick="logout()">Cerrar sesión</button>
</div>

<div class="lista" id="listaCitas">
  <h3>Reservas</h3>
</div>

<script src="app.js"></script>
<div class="watermark">FerrerasCode © 2026</div>
<div id="toast"></div>
</body>
</html>
